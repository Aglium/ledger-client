[project]
name = "aglium-ledger"
version = "0.2.1"
description = "Cross-repo impact brief for a change: the client, with no database"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Aglium" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]

[project.urls]
Homepage = "https://aglium.com/platform/ledger-server.html"
Source = "https://github.com/Aglium/ledger-client"

[project.scripts]
aglium-ledger = "ledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
