name: release
# Pushing a tag `vX.Y.Z` builds the package and attaches it to a GitHub release.
# Publishing to PyPI is off until the repository variable PUBLISH_TO_PYPI is
# `true` and PyPI trusted publishing is set up for `aglium-ledger` (workflow
# `release.yml`, environment `pypi`).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - name: The whole test suite
        # A tag on a red commit must not build: 0.4.1 was tagged on a commit
        # whose runner had lost its executable bit, and only ci.yml noticed.
        run: |
          pip install '.[mcp]' pytest pytest-asyncio respx
          pytest -q tests
      - name: Findings no worse than the baseline
        # The same check runs on every push (ci.yml, job eval); here it is required.
        run: |
          pip install .
          aglium-ledger eval
      - run: pip install build
      # Only the client is released here. The server ships as an image, privately.
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
  pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
