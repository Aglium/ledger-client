name: "Ledger — what this change affects elsewhere"
description: >
  Comment on a pull request with what it affects in OTHER repositories: fields or
  contracts it removes that another repository reads, changes in flight that cannot
  land with it, who is on the other side of each topic or route, and other work
  linked by ticket, by what it touches or by author. Works without a ticket key.
  Stateless: queries the forges directly, needs no database or service.
inputs:
  github-token:
    description: "Token with read access to the org's repos and write access to PR comments."
    required: true
  config:
    description: "Path to your ledger.yml, relative to the calling repository."
    required: true
  post:
    description: "Post the comment. Set to 'false' to render it into the log only."
    required: false
    default: "true"
  mode:
    description: "'brief' (default): the full brief. 'siblings': only work sharing the ticket, as before."
    required: false
    default: "brief"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      shell: bash
      # A composite action already has its own files at action_path, so it never
      # needs to check itself out -- which also means no org or repo name is
      # hardcoded here. Whoever hosts the action, it installs from itself.
      run: pip install -e "${{ github.action_path }}"
    - name: Remember scans between runs
      # What each repository's default branch says is read again only when
      # that branch moves. Names and directions only; no code is cached.
      uses: actions/cache@v4
      with:
        path: ~/.cache/ledger/scan
        key: ledger-scan-${{ github.run_id }}
        restore-keys: ledger-scan-
    - name: Comment
      shell: bash
      env:
        LEDGER_GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
      run: |
        # --live keeps this a single step with no infrastructure behind it.
        # Failure here must never fail someone else's PR: this is advisory, and
        # a tool that red-builds a branch on its own outage gets removed.
        aglium-ledger comment "$REPO" "$PR_NUMBER" \
          --ref "$HEAD_REF" \
          --head-sha "$HEAD_SHA" \
          --config "${{ github.workspace }}/${{ inputs.config }}" \
          --live \
          $([ "${{ inputs.mode }}" = "siblings" ] && echo "--siblings-only" || echo "--brief") \
          $([ "${{ inputs.post }}" = "true" ] && echo "--post" || echo "--dry-run") \
          || echo "::warning::ledger could not produce a comment; continuing"
